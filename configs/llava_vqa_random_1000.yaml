# config.yaml
samples: 20
triple_extraction: false
data:
  dataset: "vqa"
  root_dir: "/staging/users/tpadhi1/Multimodal-Uncertainty-Quantification/datasets_/VQA"
  image_dir: "train2014"
  annotation_file: "v1/annotations/mscoco_train2014_annotations_HIGH_agreement_question_types_GROUND.json"
  question_file: "v1/questions/OpenEnded_mscoco_train2014_questions_RANDOMSEED_42_COUNT_2000_CURRDATE_20241228_170848.json"
  dataset_type: "json"
  samples: 2000
mm_model:
  # model_path: for 7b "llava-hf/llava-1.5-7b-hf" # for 13b llava-hf/llava-1.5-13b-hf
  model_path: "llava-hf/llava-1.5-7b-hf"
  temperature: 1
  top_p: 1 
  num_beams: 1
  max_new_tokens: 512
  no_of_responses_sampled_per_image: 20
  inference_batch_size: 20 # this is the batch size for the model inference of llava


triples_model:
  model_id: "meta-llama/Meta-Llama-3-8B-Instruct"
grounding:
  detector_id: "IDEA-Research/grounding-dino-tiny"
  segmenter_id: "facebook/sam-vit-base"
  threshold: 0.01
  # dino_model_path: "path/to/dino/model"
  # top_k: 5

uncertainty:
  method: "log_likelihood"
  get_uncertainty: true

logging:
  explanation_dir: "runs_vqa6/llava_vqa_yes_gsam_grounding_random_1000/explanations"
  grounding_dir: "runs_vqa6/llava_vqa_yes_gsam_grounding_random_1000/grounding"